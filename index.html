<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="estilo.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Temp-traker</title>
  </head>
  <body>
    <div class="contenedor">
      <div class="buscador">
        <input
          type="text"
          placeholder="Ingrese nombre de la ciudad"
          spellcheck="false"
          autocomplete="off"
          id="input-ciudad"
        />
        <button onclick="obtenerClima()">
          <img src="imagenes/buscar.png" alt="Buscar" />
        </button>
      </div>

      <div class="botones-control">
        <button id="unidadBtn" onclick="cambiarUnidades()">Cambiar a °F</button>
        <button id="modoBtn" onclick="toggleModo()">Modo Claro</button>
      </div>

      <div class="clima-info">
        <p class="clima-texto">Parcialmente nublado</p>
        <img src="imagenes/clima-ejemplo.webp" class="clima-icono" alt="Icono clima" />
        <h1 class="temp">22°c</h1>
        <h2 class="ciudad">Huancayo</h2>

        <div class="detalles">
          <div class="col">
            <img src="imagenes/humedad.png" alt="Humedad" />
            <div>
              <p class="humedad">50%</p>
              <p>Humedad</p>
            </div>
          </div>
          <div class="col">
            <img src="imagenes/viento.png" alt="Viento" />
            <div>
              <p class="viento">15 km/h</p>
              <p>Viento</p>
            </div>
          </div>
        </div>
      </div>

      <div class="pronostico" id="pronostico"></div>
      <canvas id="graficoTemp"></canvas>


    </div>

    <script src="codigo.js" defer></script>
  </body>
</html>
